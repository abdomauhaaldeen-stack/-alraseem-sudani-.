
name: Build ALRASEEM SUDANI APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p source
          unzip -q ALRASEEM_SUDANI_ANDROID_BUILD_READY.zip -d source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ''

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies and build
        run: |
          cd source
          npm install
          npm run build

      - name: Create Android project
        run: |
          cd source
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd source/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALRASEEM-SUDANI-APK
          path: source/android/app/build/outputs/apk/debug/*.apk
