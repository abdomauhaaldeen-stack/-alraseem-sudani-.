
name: Build ALRASEEM SUDANI APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p source
          unzip -q ALRASEEM_SUDANI_ANDROID_BUILD_READY.zip -d source

      - name: Find project folder
        run: |
          PROJECT_DIR=$(find source -type f -name package.json -not -path "*/node_modules/*" -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "package.json not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project found at: $PROJECT_DIR"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install and build
        run: |
          cd "$PROJECT_DIR"
          npm install
          npm run build

      - name: Create Android project
        run: |
          cd "$PROJECT_DIR"
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALRASEEM-SUDANI-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
