
name: Build ALRASEEM SUDANI APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p source
          unzip -q ALRASEEM_SUDANI_ANDROID_BUILD_READY.zip -d source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          wrapper=$(find source -type f -name gradlew -print -quit)
          if [ -z "$wrapper" ]; then
            echo "Gradle wrapper not found"
            exit 1
          fi
          cd "$(dirname "$wrapper")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALRASEEM-SUDANI-APK
          path: source/**/build/outputs/apk/debug/*.apk
